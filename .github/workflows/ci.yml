name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format, lint, build, test, db)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql://minimart:changeme@127.0.0.1:5432/minimart?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minimart
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: minimart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minimart -d minimart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run test:db

  flutter-checks:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  flutter-windows-build:
    name: Flutter (Windows debug build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug